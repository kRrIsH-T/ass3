[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-model-benchmark"
version = "0.1.0"
description = "Fair AG News comparison of from-scratch sequence architectures"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["benchmark*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
